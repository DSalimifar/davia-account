services:
  db:
    image: postgres:16
    container_name: davia-account-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: davia_account
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d davia_account"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
