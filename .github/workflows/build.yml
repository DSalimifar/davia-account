name: Build DAVIA ACCOUNT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet restore

      - name: Build Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet build --configuration Release --no-restore


  backend-api-test:
    name: Backend API Integration Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: davia_test
          POSTGRES_PASSWORD: davia_test_password
          POSTGRES_DB: davia_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U davia_test -d davia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet restore

      - name: Build Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet build --configuration Release --no-restore

      - name: Start API
        working-directory: backend/DaviaAccount.Api
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=davia_test;Username=davia_test;Password=davia_test_password
          Jwt__Key: DAVIA_TEST_SECRET_KEY_2026_LONG_RANDOM_VALUE_CHANGE_LATER
          Jwt__Issuer: DaviaAccount
          Jwt__Audience: DaviaAccount
          Jwt__Minutes: 60
        run: |
          nohup dotnet run \
            --configuration Release \
            --no-build \
            --urls http://localhost:5080 \
            > api.log 2>&1 &

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/health; then
              echo
              echo "API is ready."
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API did not become ready."
          cat backend/DaviaAccount.Api/api.log || true
          exit 1

      - name: Verify unauthenticated API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:5080/api/customers)

          echo "Unauthenticated customers endpoint HTTP status: $STATUS"
          test "$STATUS" = "401"

      - name: Register Company A
        run: |
          RESPONSE=$(curl --silent --show-error \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            http://localhost:5080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "companyName": "Davia Test Company A",
              "fullName": "Test User A",
              "username": "testa@davia.local",
              "password": "TestPassword123!"
            }')

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          test "$STATUS" -ge 200
          test "$STATUS" -lt 300

      - name: Login Company A
        run: |
          RESPONSE=$(curl --silent --show-error \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            http://localhost:5080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{
              "username": "testa@davia.local",
              "password": "TestPassword123!"
            }')

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/^HTTP_STATUS:/d')

          test "$STATUS" = "200"

          TOKEN=$(echo "$BODY" | python -c "
          import sys,json
          print(json.load(sys.stdin)['token'])
          ")

          echo "API_TOKEN_A=$TOKEN" >> "$GITHUB_ENV"

      - name: Create Customer
        run: |
          RESPONSE=$(curl --silent --show-error \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            http://localhost:5080/api/customers \
            -H "Authorization: Bearer $API_TOKEN_A" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Customer A",
              "mobile": "09120000000"
            }')

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/^HTTP_STATUS:/d')

          test "$STATUS" = "201"

          CUSTOMER_ID=$(echo "$BODY" | python -c "
          import sys,json
          print(json.load(sys.stdin)['id'])
          ")

          echo "CUSTOMER_ID_A=$CUSTOMER_ID" >> "$GITHUB_ENV"

      - name: Create Product
        run: |
          RESPONSE=$(curl --silent --show-error \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            http://localhost:5080/api/products \
            -H "Authorization: Bearer $API_TOKEN_A" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Product A",
              "code": "TEST-A",
              "barcode": null,
              "salePrice": 100
            }')

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/^HTTP_STATUS:/d')

          test "$STATUS" = "201"

          PRODUCT_ID=$(echo "$BODY" | python -c "
          import sys,json
          print(json.load(sys.stdin)['id'])
          ")

          echo "PRODUCT_ID_A=$PRODUCT_ID" >> "$GITHUB_ENV"

      - name: Read Customer and Product
        run: |
          echo "===== CUSTOMERS ====="

          curl --fail --silent --show-error \
            http://localhost:5080/api/customers \
            -H "Authorization: Bearer $API_TOKEN_A"

          echo
          echo "===== PRODUCTS ====="

          curl --fail --silent --show-error \
            http://localhost:5080/api/products \
            -H "Authorization: Bearer $API_TOKEN_A"

          echo

      - name: Create Sales Invoice
        shell: bash
        run: |
          echo "===== CREATING SALES INVOICE ====="
          echo "Customer ID: $CUSTOMER_ID_A"
          echo "Product ID: $PRODUCT_ID_A"

          set +e

          RESPONSE=$(curl --silent --show-error \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            http://localhost:5080/api/invoices \
            -H "Authorization: Bearer $API_TOKEN_A" \
            -H "Content-Type: application/json" \
            -d "{
              \"customerId\": $CUSTOMER_ID_A,
              \"discount\": 10,
              \"tax\": 5,
              \"description\": \"Integration test invoice\",
              \"items\": [
                {
                  \"productId\": $PRODUCT_ID_A,
                  \"quantity\": 2,
                  \"unitPrice\": 100,
                  \"description\": \"Product A test line\"
                }
              ]
            }")

          CURL_STATUS=$?

          echo "===== CURL EXIT CODE ====="
          echo "$CURL_STATUS"

          echo "===== INVOICE RESPONSE ====="
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/^HTTP_STATUS:/d')

          echo "===== HTTP STATUS ====="
          echo "$STATUS"

          if [ "$CURL_STATUS" -ne 0 ] || [ "$STATUS" != "200" ]; then
            echo "Invoice request failed."
            echo "===== API LOG ====="
            cat backend/DaviaAccount.Api/api.log || true
            exit 1
          fi

          echo "$BODY" > /tmp/invoice-a.json

          echo "===== VERIFY INVOICE TOTAL ====="

          echo "$BODY" | python -c "
          import sys,json

          data=json.load(sys.stdin)

          total=float(data['total'])

          assert abs(total-195) < 0.01, \
              f'Expected total 195, got {total}'

          print('Invoice total verified: 195')
          "

      - name: Register Company B
        run: |
          RESPONSE=$(curl --silent --show-error \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            http://localhost:5080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "companyName": "Davia Test Company B",
              "fullName": "Test User B",
              "username": "testb@davia.local",
              "password": "TestPassword123!"
            }')

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          test "$STATUS" -ge 200
          test "$STATUS" -lt 300

      - name: Login Company B
        run: |
          RESPONSE=$(curl --silent --show-error \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            http://localhost:5080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{
              "username": "testb@davia.local",
              "password": "TestPassword123!"
            }')

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(echo "$RESPONSE" | sed '/^HTTP_STATUS:/d')

          test "$STATUS" = "200"

          TOKEN=$(echo "$BODY" | python -c "
          import sys,json
          print(json.load(sys.stdin)['token'])
          ")

          echo "API_TOKEN_B=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify Tenant Isolation
        run: |
          CUSTOMERS=$(curl --fail --silent --show-error \
            http://localhost:5080/api/customers \
            -H "Authorization: Bearer $API_TOKEN_B")

          PRODUCTS=$(curl --fail --silent --show-error \
            http://localhost:5080/api/products \
            -H "Authorization: Bearer $API_TOKEN_B")

          echo "===== COMPANY B CUSTOMERS ====="
          echo "$CUSTOMERS"

          echo "===== COMPANY B PRODUCTS ====="
          echo "$PRODUCTS"

          echo "$CUSTOMERS" | python -c "
          import sys,json
          data=json.load(sys.stdin)
          assert len(data) == 0, \
              f'Company B can see Company A customers: {data}'
          "

          echo "$PRODUCTS" | python -c "
          import sys,json
          data=json.load(sys.stdin)
          assert len(data) == 0, \
              f'Company B can see Company A products: {data}'
          "

          echo "Tenant isolation verified."

      - name: Show API log on failure
        if: failure()
        run: |
          echo "===== API LOG ====="
          cat backend/DaviaAccount.Api/api.log || true


  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: davia-frontend
          path: frontend/dist
