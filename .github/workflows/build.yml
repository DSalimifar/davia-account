name: Build DAVIA ACCOUNT

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet restore

      - name: Build Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet build --configuration Release --no-restore

  backend-api-test:
    name: Backend API Integration Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: davia_test
          POSTGRES_PASSWORD: davia_test_password
          POSTGRES_DB: davia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U davia_test -d davia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet restore

      - name: Build Backend
        working-directory: backend/DaviaAccount.Api
        run: dotnet build --configuration Release --no-restore

      - name: Start API
        working-directory: backend/DaviaAccount.Api
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=davia_test;Username=davia_test;Password=davia_test_password
          Jwt__Key: DAVIA_TEST_SECRET_KEY_2026_LONG_RANDOM_VALUE_CHANGE_LATER
          Jwt__Issuer: DaviaAccount
          Jwt__Audience: DaviaAccount
          Jwt__ExpiresMinutes: 60
        run: |
          nohup dotnet run \
            --configuration Release \
            --no-build \
            --urls http://localhost:5080 \
            > api.log 2>&1 &

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5080/api/health; then
              echo
              echo "API is ready."
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API did not become ready."
          cat backend/DaviaAccount.Api/api.log || true
          exit 1

      - name: Verify unauthenticated API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:5080/api/customers)

          test "$STATUS" = "401"

      - name: Register Company A
        run: |
          curl --fail --silent --show-error \
            -X POST \
            http://localhost:5080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "companyName": "Davia Test Company A",
              "fullName": "Test User A",
              "email": "testa@davia.local",
              "password": "TestPassword123!"
            }'

      - name: Login Company A
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST \
            http://localhost:5080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{
              "email": "testa@davia.local",
              "password": "TestPassword123!"
            }')

          echo "$RESPONSE" > /tmp/login-a.json

          TOKEN=$(echo "$RESPONSE" | python -c "
          import sys,json
          print(json.load(sys.stdin)['token'])
          ")

          echo "API_TOKEN_A=$TOKEN" >> "$GITHUB_ENV"

      - name: Create Customer
        run: |
          curl --fail --silent --show-error \
            -X POST \
            http://localhost:5080/api/customers \
            -H "Authorization: Bearer $API_TOKEN_A" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Customer A",
              "phone": "09120000000"
            }'

      - name: Create Product
        run: |
          curl --fail --silent --show-error \
            -X POST \
            http://localhost:5080/api/products \
            -H "Authorization: Bearer $API_TOKEN_A" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Product A",
              "code": "TEST-A",
              "unit": "عدد",
              "salePrice": 100
            }'

      - name: Read Customer and Product
        run: |
          curl --fail --silent --show-error \
            http://localhost:5080/api/customers \
            -H "Authorization: Bearer $API_TOKEN_A"

          echo

          curl --fail --silent --show-error \
            http://localhost:5080/api/products \
            -H "Authorization: Bearer $API_TOKEN_A"

      - name: Create Sales Invoice
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST \
            http://localhost:5080/api/invoices \
            -H "Authorization: Bearer $API_TOKEN_A" \
            -H "Content-Type: application/json" \
            -d '{
              "customerId": 1,
              "invoiceNumber": "TEST-001",
              "discount": 10,
              "tax": 5,
              "items": [
                {
                  "productId": 1,
                  "quantity": 2,
                  "unitPrice": 100
                }
              ]
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | python -c "
          import sys,json
          data=json.load(sys.stdin)
          total=float(data['total'])
          assert abs(total-195) < 0.01, f'Expected total 195, got {total}'
          print('Invoice total verified: 195')
          "

      - name: Register Company B
        run: |
          curl --fail --silent --show-error \
            -X POST \
            http://localhost:5080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "companyName": "Davia Test Company B",
              "fullName": "Test User B",
              "email": "testb@davia.local",
              "password": "TestPassword123!"
            }'

      - name: Login Company B
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST \
            http://localhost:5080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{
              "email": "testb@davia.local",
              "password": "TestPassword123!"
            }')

          TOKEN=$(echo "$RESPONSE" | python -c "
          import sys,json
          print(json.load(sys.stdin)['token'])
          ")

          echo "API_TOKEN_B=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify Tenant Isolation
        run: |
          CUSTOMERS=$(curl --fail --silent --show-error \
            http://localhost:5080/api/customers \
            -H "Authorization: Bearer $API_TOKEN_B")

          PRODUCTS=$(curl --fail --silent --show-error \
            http://localhost:5080/api/products \
            -H "Authorization: Bearer $API_TOKEN_B")

          echo "Company B customers:"
          echo "$CUSTOMERS"

          echo "Company B products:"
          echo "$PRODUCTS"

          echo "$CUSTOMERS" | python -c "
          import sys,json
          data=json.load(sys.stdin)
          assert len(data) == 0, f'Company B can see Company A customers: {data}'
          "

          echo "$PRODUCTS" | python -c "
          import sys,json
          data=json.load(sys.stdin)
          assert len(data) == 0, f'Company B can see Company A products: {data}'
          "

          echo "Tenant isolation verified."

      - name: Show API log on failure
        if: failure()
        run: |
          echo "===== API LOG ====="
          cat backend/DaviaAccount.Api/api.log || true

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: davia-frontend
          path: frontend/dist
