name: Bootstrap DAVIA ACCOUNT V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find DAVIA Project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -name "DAVIA-ACCOUNT-V1.0.0-Starter.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: DAVIA-ACCOUNT-V1.0.0-Starter.zip NOT FOUND"
            exit 1
          fi
          echo "ZIP FOUND: $ZIP"
          unzip -l "$ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract DAVIA Project
        shell: bash
        run: |
          set -e
          rm -rf davia-extracted
          mkdir -p davia-extracted
          unzip -q "$ZIP_PATH" -d davia-extracted
          find davia-extracted -maxdepth 6 -type f | sort

      - name: Detect Project Root
        shell: bash
        run: |
          set -e
          ROOT="davia-extracted"
          mapfile -t DIRS < <(find davia-extracted -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t FILES < <(find davia-extracted -mindepth 1 -maxdepth 1 -type f -print)
          if [ "${#DIRS[@]}" -eq 1 ] && [ "${#FILES[@]}" -eq 0 ]; then
            ROOT="${DIRS[0]}"
          fi
          echo "DAVIA_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PROJECT ROOT: $ROOT"

      - name: Verify DAVIA Project
        shell: bash
        run: |
          set -e
          ROOT="$DAVIA_PROJECT_ROOT"
          REQUIRED_FILES=(
            "README.md"
            "VERSION"
            "docker-compose.yml"
            "backend/DaviaAccount.Api/DaviaAccount.Api.csproj"
            "backend/DaviaAccount.Api/Program.cs"
            "frontend/package.json"
            "frontend/index.html"
            "frontend/src/main.jsx"
          )
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$ROOT/$FILE" ]; then
              echo "ERROR: Required file missing: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done
          echo "VERSION:"
          cat "$ROOT/VERSION"
          echo "DAVIA PROJECT VERIFICATION SUCCESSFUL"

      - name: Install DAVIA Project Files
        shell: bash
        run: |
          set -e
          ROOT="$DAVIA_PROJECT_ROOT"
          # Never copy .github/workflows from the ZIP.
          # This prevents the GitHub App workflow-permission error.
          rsync -a --exclude='.github/' --exclude='.git/' "$ROOT/" ./
          echo "DAVIA PROJECT INSTALLED."

      - name: Verify Installed DAVIA Project
        shell: bash
        run: |
          set -e
          REQUIRED_FILES=(
            "README.md"
            "VERSION"
            "docker-compose.yml"
            "backend/DaviaAccount.Api/DaviaAccount.Api.csproj"
            "backend/DaviaAccount.Api/Program.cs"
            "frontend/package.json"
            "frontend/index.html"
            "frontend/src/main.jsx"
          )
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Installed file missing: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done
          echo "Installed DAVIA VERSION:"
          cat VERSION
          echo "DAVIA INSTALLATION VERIFICATION SUCCESSFUL"

      - name: Remove Temporary ZIP And Extraction Directory
        shell: bash
        run: |
          set -e
          rm -rf davia-extracted
          rm -f "$ZIP_PATH"
          # Never delete or modify .github/workflows.

      - name: Show Git Changes
        shell: bash
        run: |
          git status --short

      - name: Commit DAVIA V1
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          # Safety guard: bootstrap must never modify workflow files.
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "ERROR: Bootstrap attempted to modify .github/workflows/"
            git diff --cached --name-only
            exit 1
          fi

          git commit -m "Bootstrap DAVIA ACCOUNT V1" || echo "No changes to commit"
          git push

          echo "DAVIA ACCOUNT V1 BOOTSTRAP COMPLETE"
